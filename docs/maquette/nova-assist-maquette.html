  background-color: var(--navy-950);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { height: 44px; width: auto; border-radius: 10px; background: #eaf0f8; padding: 3px; }
.titleblock { flex: 1 1 260px; text-align: center; order: 0; }
.titleblock h1 { font-size: 1.9rem; letter-spacing: 0.03em; font-weight: 800; line-height: 1.1; }
.titleblock h1 { color: #fff; }
.titleblock h1 b { color: #5b8fc9; font-weight: 800; }
.titleblock small { display: block; margin-top: 4px; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.12em; text-transform: uppercase; }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--glass); backdrop-filter: blur(10px); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-size: 0.85rem; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); font-weight: 600; }
.select { background: var(--glass); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 0.85rem; }
.select option { color: #111; }
.btn { border: 1px solid var(--line); background: var(--glass); color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; backdrop-filter: blur(10px); }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: var(--on-gold); border-color: transparent; font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 0.78rem; }
.who { font-size: 0.78rem; color: var(--muted); }

/* Onglets */
.tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tab { border: 0; background: transparent; padding: 10px 16px; color: #d3dcec; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.badge { background: var(--sunset); color: #fff; border-radius: 999px; font-size: 0.7rem; min-width: 20px; padding: 1px 6px; text-align: center; font-weight: 600; }
.admin-only[hidden] { display: none !important; }

/* Verre */
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

/* Chat */
.chat-layout { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 24px; align-items: start; margin-left: 4%; }
.chat-layout .serenity { grid-column: 2; }
.serenity { display: flex; flex-direction: column; gap: 12px; position: relative; max-width: 460px; margin-left: auto; width: 100%; }
.greet { position: relative; background: var(--glass-strong); border: 1.5px solid var(--gold); border-radius: 16px; padding: 14px 16px; font-size: 0.95rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
.greet strong { color: var(--gold); }
.greet::after { content: ""; position: absolute; right: 90px; bottom: -9px; width: 16px; height: 16px; background: var(--glass-strong); border-right: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold); transform: rotate(45deg); }
.serenity .face { display: none; }
.chat { display: flex; flex-direction: column; min-height: 520px; max-height: 70vh; overflow: hidden; background: rgba(52, 62, 84, 0.52); border-color: rgba(255, 255, 255, 0.22); }
.chat-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.chat-head b { color: var(--text); font-weight: 600; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: min(560px, 90%); padding: 11px 14px; border-radius: 16px; font-size: 0.93rem; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-start; background: #e9edf3; color: #17233a; border-bottom-left-radius: 4px; }
.bubble.bot { align-self: flex-end; background: linear-gradient(135deg, var(--blue), var(--teal)); color: #fff; border-bottom-right-radius: 4px; }
.bubble.bot.unknown { background: var(--glass-strong); border: 1px solid var(--gold); color: var(--text); }
.bubble.hello { align-self: stretch; max-width: none; background: var(--glass-strong); border: 1px solid var(--gold); color: var(--text); border-radius: 16px; }
.bubble.hello strong { color: var(--gold); }
.bubble ul, .bubble ol { margin: 6px 0 0; padding-left: 20px; }
.bubble p { margin: 0 0 6px; }
.bubble p:last-child { margin: 0; }
.src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.14); color: inherit; border-radius: 999px; padding: 2px 10px; font-size: 0.74rem; }
.chip:hover { background: rgba(255, 255, 255, 0.28); }
.typing { align-self: flex-end; color: var(--muted); font-size: 0.82rem; }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; color: var(--text); font: inherit; }
.composer input::placeholder { color: var(--muted); }
.hint { font-size: 0.76rem; color: var(--muted); padding: 0 16px 12px; }

/* Détail */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; }
.pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.detail { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
.toc { padding: 10px; max-height: 640px; overflow-y: auto; }
.toc h3 { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.toc button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; font-size: 0.84rem; color: var(--text); }
.toc button:hover { background: rgba(255, 255, 255, 0.07); }
.toc button[aria-current="true"] { background: rgba(217, 182, 115, 0.18); color: var(--gold); }
.toc .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; }
.sheet { background: var(--paper); color: var(--paper-ink); border-radius: 16px; padding: 22px; min-width: 0; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35); }
.sheet-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #d6dce8; color: #51607c; font-size: 0.8rem; }
.sheet-bar .btn { color: var(--paper-ink); background: #fff; border-color: #cdd5e3; backdrop-filter: none; }
.sheet h2 { font-size: 1.4rem; color: var(--navy-800); margin-bottom: 2px; }
.sheet .sub { color: #51607c; margin: 0 0 14px; font-size: 0.9rem; }
.sheet h3 { font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-deep); margin: 18px 0 8px; }
.tablewrap { overflow-x: auto; border: 1px solid #d6dce8; border-radius: 10px; background: #fff; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 0.86rem; min-width: 420px; }
.sheet th { background: var(--navy-800); color: #fff; text-align: left; padding: 8px 10px; font-weight: 600; }
.sheet td { color: var(--paper-ink); padding: 8px 10px; border-top: 1px solid #e3e8f1; vertical-align: top; }
.sheet td.grp { background: #e8edf6; font-weight: 700; color: var(--navy-800); }
.sheet td.num { white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; background: #fff; border: 1px solid #d6dce8; border-radius: 10px; padding: 9px 12px; }
.steps .k { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--on-gold); font-weight: 700; display: grid; place-items: center; font-size: 0.82rem; }
.steps b { display: block; color: var(--navy-800); }
.tip { margin-top: 12px; border-left: 4px solid var(--gold); background: #fbf4e4; padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 0.88rem; }
.placeholder { color: #51607c; font-style: italic; background: #fff; border: 1px dashed #b9c3d6; border-radius: 10px; padding: 16px; }
.pager { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
.sheet ul.plain { margin: 6px 0; padding-left: 20px; }
.compl { display: grid; gap: 10px; }
.compl article { background: #fff; border: 1px solid #d6dce8; border-radius: 10px; padding: 10px 12px; }
.compl article b { color: var(--navy-800); }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* Admin */
.panel { padding: 18px; }
.panel h2 { font-size: 1.1rem; margin-bottom: 4px; }
.panel .sub { color: var(--muted); margin: 0 0 14px; font-size: 0.88rem; }
.list { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 640px; }
.list th { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.list td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tw { overflow-x: auto; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
.status.ok { color: #8fe0c3; border-color: rgba(143, 224, 195, 0.4); }
.status.wait { color: var(--gold); border-color: rgba(217, 182, 115, 0.5); }
.drop { margin-top: 16px; border: 1.5px dashed var(--gold); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.drop label { font-size: 0.82rem; color: var(--muted); display: grid; gap: 4px; }
.field { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text); font: inherit; width: 100%; }
.progress { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 0.86rem; }
.progress li { color: var(--muted); display: flex; gap: 8px; align-items: center; }
.progress li.done { color: #8fe0c3; }
.progress li.run { color: var(--gold); }
.qcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: rgba(255, 255, 255, 0.04); }
.qcard + .qcard { margin-top: 12px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 0.78rem; }
.qtext { font-weight: 600; font-size: 1rem; }
.qcard textarea { min-height: 70px; resize: vertical; }
.done-note { color: #8fe0c3; font-size: 0.85rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--glass-strong); border: 1px solid var(--gold); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 0.85rem; z-index: 20; max-width: calc(100vw - 32px); }
.note { font-size: 0.76rem; color: var(--muted); text-align: center; }

@media (max-width: 860px) {
  .chat-layout, .detail { grid-template-columns: minmax(0, 1fr); }
  .chat-layout { margin-left: 0; }
  .chat-layout .serenity { grid-column: 1; }
  .serenity { order: -1; flex-direction: row; align-items: flex-end; max-width: none; }
  .serenity .face { display: block; width: 96px; flex: none; order: 2; }
  .greet { flex: 1; font-size: 0.86rem; }
  .greet::after { right: 36px; }
  .titleblock h1 { font-size: 1.5rem; }
  .chat { max-height: none; min-height: 460px; }
  .toc { max-height: 220px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

    var steps = ["Lecture du fichier", "Extraction du texte, des tableaux et des images", "Structuration par l'IA", "Contrôle de fidélité avec l'original", "Publication pour le site"];
    var prog = an ? '<ul class="progress">' + steps.map(function (s, i) { return '<li class="' + (i < an.step ? "done" : i === an.step ? "run" : "") + '">' + (i < an.step ? "✓" : i === an.step ? "…" : "○") + " " + s + "</li>"; }).join("") + "</ul>" : "";
    return '<section class="glass panel"><h2>Livrets du site ' + esc(siteName()) + '</h2><p class="sub">Un site peut avoir plusieurs livrets (Accueil, Conciergerie…). Formats acceptés : Word, PDF, PowerPoint.</p>' +
      (state.site === "seine" ? '<div class="tw"><table class="list"><thead><tr><th>Livret</th><th>Format</th><th>Pages</th><th>Statut</th><th>Actions</th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<div class="empty">Aucun livret pour ce site.</div>') +
      '<div class="drop"><b>Déposer un livret</b><label for="lt">Titre du livret<input class="field" id="lt" type="text" placeholder="Ex. : Procédure d\'accueil"></label><label for="lf">Fichier (.docx, .pdf, .pptx)<input class="field" id="lf" type="file" accept=".docx,.pdf,.pptx"></label><div><button type="button" class="btn gold" data-act="analyse"' + (an ? " disabled" : "") + '>Déposer et analyser</button></div>' + prog + "</div></section>";
  }

  function viewQuestions() {
    var open = state.questions.filter(function (q) { return q.site === state.site; });
    var cards = open.map(function (q) {
      if (q.answered) return '<div class="qcard"><div class="qtext">' + esc(q.text) + '</div><div class="qmeta"><span>Site ' + esc(siteName()) + "</span><span>" + esc(q.date) + '</span></div><div class="done-note">✓ Ajoutée aux compléments : Serenity pourra maintenant y répondre.</div></div>';
      return '<div class="qcard"><div class="qtext">' + esc(q.text) + '</div><div class="qmeta"><span>Site ' + esc(siteName()) + "</span><span>" + esc(q.date) + '</span><span>Réponse de Serenity : « Je ne sais pas, désolé. »</span></div><label class="who" for="a' + q.id + '">Votre réponse</label><textarea class="field" id="a' + q.id + '" placeholder="Saisissez la réponse à ajouter au savoir de Serenity"></textarea><div><button type="button" class="btn gold" data-ans="' + q.id + '">Ajouter aux compléments</button></div></div>';
    }).join("");
    return '<section class="glass panel"><h2>Questions sans réponse · ' + esc(siteName()) + '</h2><p class="sub">Les questions auxquelles Serenity n\'a pas su répondre, rattachées au site. Une réponse saisie ici complète Serenity pour toutes les hôtesses du site.</p>' + (cards || '<div class="empty">Aucune question en attente.</div>') + "</section>";
  }

  /* ---------- Rendu ---------- */
  function render() {
    var admin = state.role === "admin";
    document.querySelectorAll(".admin-only").forEach(function (e) { e.hidden = !admin; });
    document.querySelectorAll("#roleSeg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.role === state.role)); });
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)); });
    $("#siteSel").value = state.site;
    $("#siteTitle").textContent = "Livret d'accueil du site " + siteName();
    var nq = openQuestions().length; $("#qBadge").textContent = nq; $("#qBadge").hidden = nq === 0;
    if (!admin && (state.tab === "livrets" || state.tab === "questions")) state.tab = "chat";
    var v = $("#view");
    var keep = document.activeElement && document.activeElement.id === "q" ? $("#q").value : "";
    v.innerHTML = state.tab === "chat" ? viewChat() : state.tab === "detail" ? viewDetail() : state.tab === "livrets" ? viewLivrets() : viewQuestions();
    if (state.tab === "chat") {
      var m = $("#msgs"); m.scrollTop = m.scrollHeight;
      if (keep) $("#q").value = keep;
    }
  }

  /* ---------- Événements ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.role) { state.role = t.dataset.role; render(); return; }
    if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
    if (t.dataset.liv) { state.livret = t.dataset.liv; if (t.dataset.liv !== "compl") state.page = t.dataset.liv === "accueil" ? 4 : 8; render(); return; }
    if (t.dataset.page) { state.page = +t.dataset.page; render(); return; }
    if (t.dataset.nav) { state.page = Math.min(LIVRETS[state.livret].total, Math.max(1, state.page + +t.dataset.nav)); render(); return; }
    if (t.dataset.src) {
      var s = t.dataset.src.split(":");
      if (s[0] === "compl") { state.livret = "compl"; } else { state.livret = s[0]; state.page = +s[1]; }
      state.tab = "detail"; render(); window.scrollTo(0, 0); return;
    }
    if (t.id === "backPass") { toast("Ouvre la page d'accès de Nova Pass (adresse à renseigner plus tard)."); return; }
    if (t.dataset.ans) {
      var id = +t.dataset.ans, ta = $("#a" + id), q = state.questions.filter(function (x) { return x.id === id; })[0];
      if (!ta.value.trim()) { toast("Saisissez d'abord une réponse."); ta.focus(); return; }
      q.answered = true; state.complements.push({ q: q.text, a: ta.value.trim() });
      toast("Réponse ajoutée aux compléments du site " + siteName() + "."); render(); return;
    }
    if (t.dataset.act === "dl") { toast("Maquette : le fichier d'origine se télécharge ici."); return; }
    if (t.dataset.act === "replace") { toast("Maquette : un nouveau dépôt remplace l'ancien livret."); return; }
    if (t.dataset.act === "del") { toast("Maquette : suppression simulée."); return; }
    if (t.dataset.act === "analyse") {
      var f = $("#lf").files && $("#lf").files[0], title = $("#lt").value.trim() || (f ? f.name.replace(/\.[^.]+$/, "") : "");
      if (!f) { toast("Choisissez d'abord un fichier .docx, .pdf ou .pptx."); return; }
      var ext = f.name.split(".").pop().toUpperCase();
      state.analysing = { step: 0 }; render();
      var iv = setInterval(function () {
        state.analysing.step++;
        if (state.analysing.step >= 5) {
          clearInterval(iv); state.analysing = null;
          state.uploads.push({ titre: title, fichier: f.name, format: ext, pages: 0, date: "Analysé le 19 nov. 2026 (simulation)" });
          toast("Livret publié (simulation)."); render(); return;
        }
        render();
      }, 700);
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "composer") { e.preventDefault(); var i = $("#q"); var v = i.value; i.value = ""; ask(v); }
  });
  $("#siteSel").addEventListener("change", function (e) {
    state.site = e.target.value;
    state.chat = []; state.livret = "accueil"; state.page = 4; render();
  });
  render();
})();
</script>
